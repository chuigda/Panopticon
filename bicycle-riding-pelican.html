<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车·骑·鹈鹕</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background: linear-gradient(#8ec9f0 0%, #d8ecf8 60%, #4f9ac9 60.5%, #2f6f9c 100%);
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #123;
    padding: 2rem 1rem;
  }
  h1 { font-size: 1.6rem; letter-spacing: .3em; }
  h1 span { opacity: .55; font-size: .7em; letter-spacing: .1em; }
  p { font-size: .9rem; opacity: .75; text-align: center; max-width: 36rem; line-height: 1.6; }
  .stage {
    width: min(900px, 96vw);
    aspect-ratio: 16 / 9;
    background: linear-gradient(#a7d7f5, #e6f4fc);
    border-radius: 1rem;
    box-shadow: 0 20px 50px rgba(0,40,80,.3);
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; }

  .cloud { animation: drift linear infinite; }
  .cloud.c1 { animation-duration: 26s; }
  .cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
  .cloud.c3 { animation-duration: 20s; animation-delay: -6s; }
  @keyframes drift { from { transform: translateX(900px); } to { transform: translateX(-300px); } }

  .rider { animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

  .wing-near { transform-origin: 430px 275px; animation: flap 1.1s ease-in-out infinite; }
  .wing-far  { transform-origin: 390px 265px; animation: flap 1.1s ease-in-out infinite reverse; }
  @keyframes flap { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(18deg); } }

  .wheel { animation: spin 1.4s linear infinite; }
  .wheel.rear  { transform-origin: 330px 225px; }
  .wheel.front { transform-origin: 460px 225px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .reins { stroke-dasharray: 6 4; animation: reins 1s linear infinite; }
  @keyframes reins { to { stroke-dashoffset: -10; } }

  .wave { animation: wave 3s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-30px); } }
</style>
</head>
<body>
  <h1>自行车骑鹈鹕 <span>Bicycle riding a pelican</span></h1>

  <div class="stage">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一辆自行车骑在一只飞行的鹈鹕背上，握着缰绳">
      <defs>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5aa9d8"/>
          <stop offset="1" stop-color="#2b6d9b"/>
        </linearGradient>
      </defs>

      <!-- 太阳 -->
      <circle cx="700" cy="80" r="38" fill="#ffe27a"/>

      <!-- 云 -->
      <g fill="#fff" opacity=".9">
        <g class="cloud c1"><ellipse cx="0" cy="90" rx="50" ry="18"/><ellipse cx="30" cy="80" rx="35" ry="22"/><ellipse cx="-25" cy="82" rx="28" ry="18"/></g>
        <g class="cloud c2"><ellipse cx="0" cy="160" rx="60" ry="20"/><ellipse cx="35" cy="148" rx="40" ry="26"/><ellipse cx="-30" cy="152" rx="32" ry="20"/></g>
        <g class="cloud c3"><ellipse cx="0" cy="50" rx="36" ry="13"/><ellipse cx="20" cy="42" rx="26" ry="17"/></g>
      </g>

      <!-- 海 -->
      <rect x="0" y="380" width="800" height="70" fill="url(#sea)"/>
      <g class="wave" fill="none" stroke="#bfe6ff" stroke-width="3" stroke-linecap="round" opacity=".7">
        <path d="M-40 400 q 20 -8 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0"/>
        <path d="M-20 425 q 20 -8 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0" opacity=".5"/>
      </g>

      <!-- 坐骑 + 骑手 -->
      <g class="rider">
        <!-- ===== 鹈鹕 ===== -->
        <!-- 远侧翅膀 -->
        <path class="wing-far" d="M390 265 C 330 200, 230 190, 150 215 C 220 220, 290 245, 380 285 Z" fill="#cfd4d8" stroke="#8f979e" stroke-width="3" stroke-linejoin="round"/>

        <!-- 尾羽 -->
        <path d="M262 300 L 190 285 L 205 305 L 180 315 L 210 325 L 200 345 L 268 325 Z" fill="#e9ecef" stroke="#8f979e" stroke-width="3" stroke-linejoin="round"/>

        <!-- 身体 -->
        <ellipse cx="400" cy="315" rx="150" ry="70" fill="#f4f6f7" stroke="#8f979e" stroke-width="3"/>

        <!-- 收起的腿脚 -->
        <g stroke="#e58a2e" stroke-width="6" stroke-linecap="round" fill="#f0a24a">
          <path d="M380 380 l 8 22" /><path d="M370 402 l 18 0 l 8 -8" stroke-width="5"/>
          <path d="M430 378 l 6 22" /><path d="M420 400 l 18 0 l 8 -8" stroke-width="5"/>
        </g>

        <!-- 脖子 -->
        <path d="M520 275 C 560 260, 580 230, 585 190 C 588 165, 605 150, 625 155 L 640 175 C 622 176, 606 190, 604 205 C 598 245, 575 285, 535 300 Z" fill="#f4f6f7" stroke="#8f979e" stroke-width="3" stroke-linejoin="round"/>

        <!-- 头 -->
        <circle cx="622" cy="165" r="30" fill="#f4f6f7" stroke="#8f979e" stroke-width="3"/>
        <!-- 眼睛 -->
        <circle cx="633" cy="158" r="5" fill="#222"/>
        <circle cx="635" cy="156" r="1.6" fill="#fff"/>

        <!-- 喙：上颌 -->
        <path d="M645 158 L 785 172 L 780 182 L 645 176 Z" fill="#f6b64b" stroke="#c97f1d" stroke-width="3" stroke-linejoin="round"/>
        <!-- 喙：喉囊 -->
        <path d="M645 176 L 780 182 C 760 205, 700 235, 655 215 C 640 208, 636 190, 645 176 Z" fill="#ffd27a" stroke="#c97f1d" stroke-width="3" stroke-linejoin="round"/>
        <!-- 喙尖钩 -->
        <path d="M785 172 q 8 6 -2 12" fill="none" stroke="#c97f1d" stroke-width="3" stroke-linecap="round"/>

        <!-- ===== 自行车（骑手） ===== -->
        <!-- 车轮跨在背上：先画后半部分被身体遮住的地方，这里直接把轮子画在身体前面表示“跨坐” -->
        <g fill="none" stroke="#2d3436" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <!-- 后轮 -->
          <g class="wheel rear">
            <circle cx="330" cy="225" r="42"/>
            <circle cx="330" cy="225" r="6" fill="#2d3436"/>
            <g stroke-width="2" opacity=".8">
              <path d="M330 183 V267 M288 225 H372 M300 195 L360 255 M360 195 L300 255"/>
            </g>
          </g>
          <!-- 前轮 -->
          <g class="wheel front">
            <circle cx="460" cy="225" r="42"/>
            <circle cx="460" cy="225" r="6" fill="#2d3436"/>
            <g stroke-width="2" opacity=".8">
              <path d="M460 183 V267 M418 225 H502 M430 195 L490 255 M490 195 L430 255"/>
            </g>
          </g>
        </g>

        <!-- 车架 -->
        <g fill="none" stroke="#d63031" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M330 225 L 385 230 L 370 160 Z"/>            <!-- 后三角 -->
          <path d="M385 230 L 445 165 L 370 160"/>             <!-- 下管 + 上管 -->
          <path d="M445 165 L 460 225"/>                       <!-- 前叉 -->
          <path d="M370 160 L 362 138"/>                       <!-- 座管 -->
          <path d="M445 165 L 440 142"/>                       <!-- 车把立管 -->
        </g>
        <!-- 牙盘与脚踏 -->
        <circle cx="385" cy="230" r="12" fill="none" stroke="#2d3436" stroke-width="4"/>
        <path d="M385 230 l 10 -16 m -10 16 l -10 16" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>
        <!-- 车座 -->
        <path d="M340 136 L 380 136 Q 372 128, 348 130 Z" fill="#2d3436" stroke="#2d3436" stroke-width="4" stroke-linejoin="round"/>
        <!-- 车把 -->
        <path d="M425 138 Q 440 132 455 138" fill="none" stroke="#2d3436" stroke-width="6" stroke-linecap="round"/>
        <!-- 小头盔：戴在车座上 -->
        <path d="M342 128 Q 360 100 380 128 Z" fill="#00b894" stroke="#00896e" stroke-width="3" stroke-linejoin="round"/>
        <!-- 车铃 -->
        <circle cx="452" cy="132" r="5" fill="#fdcb6e" stroke="#b8860b" stroke-width="2"/>

        <!-- 缰绳：从车把牵到鹈鹕喙根 -->
        <path class="reins" d="M455 138 C 520 130, 590 150, 646 168" fill="none" stroke="#6d4c2a" stroke-width="3" stroke-linecap="round"/>

        <!-- 近侧翅膀（盖在身体和车轮前面） -->
        <path class="wing-near" d="M430 275 C 380 205, 280 190, 190 215 C 270 225, 340 260, 420 300 Z" fill="#e2e6e9" stroke="#8f979e" stroke-width="3" stroke-linejoin="round"/>

        <!-- 速度线 -->
        <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8">
          <path d="M120 250 h 50"/><path d="M100 275 h 70"/><path d="M130 300 h 40"/>
        </g>
      </g>
    </svg>
  </div>

  <p>骑手是自行车，坐骑是鹈鹕。自行车两轮跨坐在鹈鹕背上，车把上牵着缰绳，车座上还戴着头盔。</p>
</body>
</html>
