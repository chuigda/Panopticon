# type: simulator
kind = "mk"
universeName = "Harry Potter universe"
literalWorkName = "Harry Potter series"
prologue = """
"""

language = "zh_CN"

[statusBar]
rule = """
Relationship management
- Unless user requested, you MUST NOT promote secondary people(次要人物) to important people(重要人物). You MUST NOT demote important people to secondary people. You MUST NOT delete any NPCs from either section.
- When user requested, you MUST follow the command below to add an NPC to important people section, see below.

<command pattern="$将*添加到重要人物">
  If user's input contains the pattern "$将*添加到重要人物", you MUST perform the following actions step by step:
  1. Extract the * part as the name of an NPC to be added;
  2. If the NPC is already in “重要人物” section, ignore this command;
  3. If the NPC is in “次要人物” section, move it to Important People section;
  4. If the NPC is not in either section, create a new entry for it.
  5. If user is trying adding more than 5 important people, you MUST demote the least important one (the one with the lowest friendliness score) to make space for the new one.
</command>

Field reference
- 日期 / 时间 / 天气: the in-world moment AFTER the latest player action. weekday in English (Monday, Tuesday, …). period is one of 凌晨/清晨/早晨/上午/中午/下午/傍晚/晚上/深夜. If the scene is indoors and the weather cannot be observed, reuse the last known weather.
- 地点: from country down to the exact spot, joined with " - ", e.g. 英国 - 伦敦 - 对角巷 - 丽痕书店.
- 角色: every character present in the current scene, the player character included.
- 外貌 / 智力: integer out of 100. 外貌 rates looks only, never personality or charm.
- 身份: three parts — wizarding identity | bloodline | background. Students write 学院+年级, e.g. 格兰芬多三年级; if they also hold a post (级长, 男生学生会主席, …), append it right after, e.g. 格兰芬多三年级 级长. Non-students use their title, e.g. 魔药学教授.
- 外在: 发型 / 配饰 / 服装 / 头发颜色 / 眼睛颜色 take one short phrase each; 简述 gives the overall impression in three or four 4-character Chinese phrases.
- 内在: 表面性格 = what others see; 隐藏性格 = what the player character keeps to themselves; 癖好 = habits and quirks. 成绩 appears only after the player character has sat an exam, and uses wizarding ranks O/E/A/P/D/T, e.g. 魔药学: O，变形术: E.
- 技能: "名称 Lv等级: 经验/100". Drop Lv for skills without a level, drop the experience part for skills without it. A skill absent from this line is untrained or unknown.
- 社交: 知名度 out of 1000 and strictly non-decreasing — it may rise or hold, never fall. 外界评价: how the wizarding public reads the player character right now.
- 物品栏: 道具 = carried items; 衣橱 = clothes owned; 魔杖 = 木材，长度吋，杖芯，特性; currency as 金加隆/银西可/铜纳特; 其他财产 = everything else, e.g. 12 GBP. A number changes only when the story shows it changing.
- 重要人物: at most 5, ordered by closeness. Each entry needs six " | "-separated parts — 关系 | 性格(three 4-character phrases) | 外貌 | 隐藏特质 | 背景 | 身份. 心动值 reads N/A unless romance with this NPC is possible. 与你的羁绊 lists the concrete events shared with the player character; 你对 NPC 的了解 covers only what the player character has actually learned.
- 次要人物: people met but not bonded with. 对你的想法 is optional — include it only when there was a recent interaction.
- Both 重要人物 and 次要人物 print 空 when the section is empty.
- Keep previous values for anything the latest turn does not touch.
"""
format = """
{# marks: numbering for 重要人物 entries, indexed by loop.index0 #}
{%- set marks = ["①", "②", "③", "④", "⑤"] -%}
## 🔮 当前场景 🔮

日期: {{time.year}}-{{time.month}}-{{time.day}} {{time.weekday}} | 时间: {{time.period}}{# 凌晨/清晨/早晨/上午/中午/下午/傍晚/晚上/深夜 #} | 天气: {{weather}}

地点: {{location}}

角色: {% for character in characters %}{{character.name}}{% if not loop.last %}，{% endif %}{% endfor %}

---

## 🎉 人物属性 🎉

姓名: {{pc.name}} | 年龄: {{pc.age}} | 性别: {{pc.gender}} | 外貌: {{pc.appearance}}/100 | 智力: {{pc.intelligence}}/100

身份: [ {{pc.identity}}{% if pc.house_grade %} {{pc.house_grade}}{% endif %} | {{pc.bloodline}} | {{pc.background}} ]

外在: [ 发型: {{pc.hair_style}} | 配饰: {{pc.accessories}} | 服装: {{pc.outfit}} | 头发颜色: {{pc.hair_color}} | 眼睛颜色: {{pc.eye_color}} | 简述: {{pc.appearance_brief}} ]

内在: [ 表面性格: {{pc.surface_personality}} | 隐藏性格: {{pc.inner_personality}} | 癖好: {{pc.quirks}}{% if pc.grades %} | 成绩: {{pc.grades}}{% endif %} ]

技能: [ {% for skill in pc.skills %}{{skill.name}}{% if skill.level %} Lv{{skill.level}}{% endif %}{% if skill.xp %}: {{skill.xp}}/100{% endif %}{% if not loop.last %} | {% endif %}{% endfor %} ]

社交: [ 知名度: {{pc.fame}}/1000 | 外界评价: {{pc.public_opinion}} ]

---

## 💰 物品与财产 💰

物品栏: [ 道具: {{pc.items}} | 衣橱: {{pc.wardrobe}} | 魔杖: {{pc.wand.wood}}，{{pc.wand.length}}吋，{{pc.wand.core}}，{{pc.wand.flexibility}} | 金加隆: {{pc.money.galleons}} 银西可: {{pc.money.sickles}} 铜纳特: {{pc.money.knuts}} | 其他财产: {{pc.other_properties}} ]

---

## 🤝 人际关系 🤝

重要人物:

{% for npc in important_people[:5] %}
> {{marks[loop.index0]}}【{{npc.name}}】
> - {{npc.relationship}} | {{npc.personality}} | {{npc.appearance}} | {{npc.hidden_traits}} | {{npc.background}} | {{npc.identity}}
> - 好感度: {{npc.friendliness}}/100 | 心动值: {% if npc.romance is not none %}{{npc.romance}}/100{% else %}N/A{% endif %} | 校园知名度: {{npc.fame}}/1000
> - 对你的想法: {{npc.opinion}} | 与你的羁绊: {{npc.bond}} | 你对 NPC 的了解: {{npc.player_knowledge}}

{% else %}
空

{% endfor %}
次要人物:

{% for npc in secondary_people %}
> - 【{{npc.name}}】: {{npc.identity}} | {{npc.gender}} | {{npc.personality}} | {{npc.relationship}} | 好感度: {{npc.friendliness}}/100{% if npc.opinion %} | 对你的想法: {{npc.opinion}}{% endif %}
{% else %}
空

{% endfor %}
"""
example = """
