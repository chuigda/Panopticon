kind = "cd"
universeName = "Teyvat (Genshin Impact universe)"
literalWorkName = "Genshin Impact"
prologue = """
"""

language = "zh_CN"

[statusBar]
format = """
# 提瓦特 — 动态状态

> 时段: {{time_period}} | 焦点地区: {{focus_region}}

---

## 势力动态

{% for f in factions %}
### {{f.name}}
- 阵营: {{f.affiliation}} | 态势: {{f.stance}}
- 动向: {{f.activity}}

{% else %}
无
{% endfor %}
---

## 人物

{% for c in characters %}
### {{c.name}} | {{c.gender}} | {{c.age}}
{% if c.eliminated %}
**({{c.status}})** — {{c.cause}}
{% else %}
- 位置: {{c.location}} | 状态: {{c.status}}
- 身份: {{c.identity}}
- 力量: {{c.power}}
- 外表: {{c.appearance}}
- 性格: {{c.personality}}
- 目标:
{% for g in c.goals %}
  * {{g}}
{% endfor %}
- 人际:
{% for r in c.relations %}
  * {{r.target}}: {{r.info}}
{% endfor %}
{% endif %}

{% endfor %}
---

## Flags

{% for f in flags %}
- {{f}}
{% else %}
- 无
{% endfor %}
{# time_period: 凌晨/清晨/早上/上午/中午/午后/下午/傍晚/夜晚/深夜 #}
{# focus_region: 当前叙事焦点所在国家/地区，如 "蒙德·晨曦酒庄"、"璃月·层岩巨渊" #}
{# f.affiliation: 七国政权/愚人众/深渊教团/民间组织/… #}
{# f.stance: 稳定/扩张/戒备/内乱/潜伏/… #}
{# f.activity: 一句话概述该势力当前正在做什么 #}
{# c.age: 数字、年龄段或 "外貌约 20，实际逾 500" #}
{# c.status: 正常/受伤/失踪/死亡/被俘/…；eliminated 为 true（死亡/失踪等）时只保留标题行，正文替换为一行原因 #}
{# c.power: 神之眼元素及武器，如 "火·神之眼，双手剑"；邪眼、魔神之力、非原著能力等亦填此处；无则填 "无" #}
{# flags: 悬而未决的威胁、倒计时、暗线、尚未兑现的承诺等 #}
"""

rule = """
- Track factions and named characters relevant to the current narrative arc; the board reflects the WORLD's state, not one party's.
- Factions and characters that exit the scene or become irrelevant can be removed to save space.
- 身份 (identity): e.g. 西风骑士团代理团长 / 璃月七星·天权 / 愚人众执行官第八席.
- 力量 (power): Vision element + weapon; also 邪眼, 魔神残力, non-canon abilities. One line.
- 性格 (personality): prefer three or four 4-character Chinese phrases.
- 人际 (relations) should include motivations and context, not just labels.
- Other fields should stay concise — one line where possible.
- Dead/eliminated characters: keep header, replace body with **(死亡/失踪/etc.)** — <one-line cause>.
- Update the time_period / focus_region line after each conducting department instruction.
"""

