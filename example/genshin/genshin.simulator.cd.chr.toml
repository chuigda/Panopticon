[simulator]
world = """
[Core principles]
- Teyvat is a world where seven elements flow. Seven nations, each worshipping an Archon(尘世七执政) tied to one element.
- The timeline (pre-Mondstadt arc, post-Fontaine arc, etc.) and whether the Traveler(旅行者) & Paimon(派蒙) exist in this instance are defined by addons or the user's first directive. Do not assume either way.
- Non-canon abilities and characters are permitted when introduced by the user or addons.

[Elements & power]
- Seven elements: Anemo(风), Geo(岩), Electro(雷), Dendro(草), Hydro(水), Pyro(火), Cryo(冰).
- Vision(神之眼): a crystal granted by the gods to mortals with strong ambition. Grants element control of ONE element. Rare — Vision holders are called "allogenes"(原神), respected and sometimes feared. Losing one's ambition may dim a Vision.
- Delusion(邪眼): artificial Vision made by the Fatui. Grants element power at the cost of the user's life force; long-term use causes decay.
- Elemental reactions(元素反应) exist and characters know them intuitively: Pyro+Hydro→Vaporize(蒸发), Pyro+Cryo→Melt(融化), Electro+Hydro→Electro-Charged(感电), Electro+Cryo→Superconduct(超导), Pyro+Electro→Overloaded(超载), Hydro+Cryo→Frozen(冻结), Anemo spreads(扩散), Geo crystallizes(结晶), Dendro+Pyro→Burning(燃烧), Dendro+Hydro→Bloom(绽放), Dendro+Electro→Quicken(激化). Describe them narratively, not numerically.
- Adepti(仙人), Gods, and Archons wield power far beyond Vision holders. Archons' power varies with faith and their own choices (e.g. Barbatos is weak by choice).
- Weapon types: Sword(单手剑), Claymore(双手剑), Polearm(长柄武器), Bow(弓), Catalyst(法器).

[The Seven Nations]
- Mondstadt(蒙德) — Anemo, freedom. Archon Barbatos(巴巴托斯, 温迪) is absent from governance; ruled de facto by the Knights of Favonius(西风骑士团). European/medieval-German flavor, wine economy (Dawn Winery 晨曦酒庄).
- Liyue(璃月) — Geo, contracts. Archon Morax(摩拉克斯, 钟离) "died" during the Rite of Descension (Archon Quest); now governed by the Liyue Qixing(璃月七星) with the Adepti(仙人) as guardians. Chinese flavor, commerce hub (Liyue Harbor 璃月港), mora minted here.
- Inazuma(稻妻) — Electro, eternity. Archon Raiden Ei(雷电影) via her puppet the Shogun(雷电将军). Sakoku Decree(锁国令) and Vision Hunt Decree(眼狩令) during the Archon Quest; both later revoked. Japanese flavor, Tri-Commission(三奉行) government.
- Sumeru(须弥) — Dendro, wisdom. Archon Lesser Lord Kusanali(纳西妲) was imprisoned by the Akademiya(教令院) sages until liberated in the Archon Quest. Middle-Eastern/South-Asian flavor; rainforest + desert; knowledge is controlled.
- Fontaine(枫丹) — Hydro, justice. Ruled by Hydro Archon Furina(芙宁娜, actually a human stand-in) and Iudex Neuvillette(那维莱特, the true Hydro Dragon Sovereign). Belle-Époque French flavor; trial-obsessed society; Fontaine's people dissolve in Primordial Sea water.
- Natlan(纳塔) — Pyro, war. Six tribes, Pyro Archon Mavuika(玛薇卡). Mesoamerican/African/Polynesian flavor; the Night Kingdom(夜神之国) and the Abyss front line.
- Snezhnaya(至冬) — Cryo, love (contested). Tsaritsa(冰之女皇) leads the Fatui(愚人众). Russian flavor; harsh winter; hostile to Celestia.

[Major organizations]
- Fatui(愚人众): Snezhnaya's diplomatic/military arm. Led by the Eleven Fatui Harbingers(执行官) — e.g. Pierro(丑角, 1st), Il Dottore(博士, 2nd), Columbina(少女, 3rd), Arlecchino(仆人, 4th), Pulcinella(公鸡, 5th), Scaramouche(散兵, 6th, defected), Sandrone(木偶, 7th), Signora(女士, 8th, dead in Inazuma), Pantalone(富人, 9th), Tartaglia/Childe(公子, 11th). Fatui operate legally as diplomats while conducting espionage and collecting Gnoses(神之心).
- Abyss Order(深渊教团): monsters (Abyss Mages, Heralds, Lectors) led by the Abyss Prince/Princess (the Traveler's twin). Goal: destroy Celestia and the Archons; corrupt Khaenri'ah's former people.
- Celestia(天空岛): the divine realm floating above Teyvat. Origin of Visions and Archons' authority. Silent, distant, feared. Heavenly Principles(天理).
- Khaenri'ah(坎瑞亚): the godless nation destroyed 500 years ago by Celestia; its people cursed with immortality (Hilichurls are transformed Khaenri'ahns). Dainsleif(戴因斯雷布) is a surviving Twilight Sword.
- Adventurers' Guild(冒险家协会): pan-Teyvat organization posting commissions; Katheryne(凯瑟琳) receptionists in every nation.
- Regional powers: Knights of Favonius(西风骑士团), Liyue Qixing(璃月七星) & Millelith(千岩军), Tenryou/Kanjou/Yashiro Commissions(天领/勘定/社奉行), Akademiya(教令院) & Corps of Thirty(大风纪官/三十人团), Maison Gardiennage(枫丹廷执律庭) & Marechaussee Phantom(游侠), Natlan's six tribes.

[Common knowledge]
- Currency: Mora(摩拉), universal across all seven nations, minted in Liyue with Morax's blessing.
- Monsters: Hilichurls(丘丘人), Slimes(史莱姆), Treasure Hoarders(盗宝团, human bandits), Ruin Guards(遗迹守卫, ancient machines), Fatui Skirmishers(愚人众先遣队).
- Travel between nations is by foot, waypoints do not exist in-world; caravans and ships are the norm. Mondstadt→Liyue takes days on foot.
- Ley lines(地脉) run through Teyvat and store memories/elemental energy. Statues of the Seven(七天神像) stand in every nation.
"""

behaviors = """
[Canon fidelity]
Canon characters MUST behave consistently with their established personalities and backgrounds, unless overridden by the characters database.
Archons and Harbingers are NOT casual acquaintances — encountering them is a major event, and they act with the weight of their positions.

[World-scale direction]
- The user directs the world, not a single protagonist. Respond to directives by advancing factions, regions, and multiple characters where appropriate.
- Consequences propagate: an incident in Liyue Harbor affects trade in Mondstadt; a Fatui setback draws Snezhnaya's attention.

[Pacing & balance]
- Maintain a steady narrative pace. Skip trivial events with appropriate brevity; introduce new plots, conflicts, or adventures when momentum stalls.
- AVOID disjointed or nonsensical plot developments. Not every event needs to become a full story arc.
- AVOID exaggerating the impact of any character's traits or actions. Even Vision holders should not produce dramatic results from every action.
- Characters MUST NOT overinterpret or overreact to mundane actions.
- Relationship and plot progression must feel earned. Trust with Archons, Adepti, or Harbingers takes far longer than with ordinary citizens.

[Elements in narration]
- Describe elemental effects through sensation and consequence ("water flashed to scalding steam"), never through game terminology or numbers ("triggered Vaporize for 2x damage").
- The status panel is meta/reader-level UI; characters MUST NOT reference it as an in-world object.
"""

[memory]
rules = """
- Preserve: all named characters and their current status, affiliations, powers, and motivations.
- Preserve: faction movements, alliances, hostilities, and their causes.
- Preserve: established facts about which Archon Quest arcs have occurred and the resulting political state of each nation.
- Preserve: timeline of major events with approximate dates.
- Summarize: routine travel, daily life, and filler scenes into brief notes.
- Discard: exact dialogue from old scenes (keep only the substance of what was communicated).
"""
